<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一人暮らし ヒアリングシート</title>
<meta name="description" content="答えていくと、親に見せるシラバスの下書きと、次にやることリストができあがります。">
<style>
:root{
  --bg:#fbfaf7; --panel:#ffffff; --fg:#15202b; --muted:#5d6b7a;
  --line:#e2ded6; --accent:#1f5f6b; --accent-soft:#e6f0f1;
  --warm:#b4651b; --warm-soft:#fbf0e4; --ok:#2d6a4f; --ok-soft:#e5f1ea;
  --shadow:0 1px 2px rgba(20,32,43,.06), 0 8px 24px rgba(20,32,43,.06);
  --radius:14px;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#13171b; --panel:#1b2026; --fg:#e8e6e1; --muted:#9aa5b1;
    --line:#2d343c; --accent:#6fb5c0; --accent-soft:#1d2c30;
    --warm:#e0a062; --warm-soft:#2b2219; --ok:#7cc4a0; --ok-soft:#1b2a23;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#13171b; --panel:#1b2026; --fg:#e8e6e1; --muted:#9aa5b1;
  --line:#2d343c; --accent:#6fb5c0; --accent-soft:#1d2c30;
  --warm:#e0a062; --warm-soft:#2b2219; --ok:#7cc4a0; --ok-soft:#1b2a23;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;
  font-size:16px; line-height:1.85; letter-spacing:.01em;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}

/* header */
header.top{
  position:sticky; top:0; z-index:20; background:var(--bg);
  border-bottom:1px solid var(--line); padding:10px 0 0;
}
.top-in{max-width:720px;margin:0 auto;padding:0 16px}
.top-row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.step-label{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 0}
.bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 20px;margin:20px 0}
h1{font-size:25px;line-height:1.45;margin:0 0 10px;letter-spacing:.01em}
h2{font-size:20px;line-height:1.5;margin:0 0 4px}
h3{font-size:16px;margin:26px 0 10px}
p{margin:0 0 14px}
.lead{color:var(--muted);font-size:14.5px;margin:0 0 18px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;
  background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:99px;margin:0 0 12px}
.tag.warm{background:var(--warm-soft);color:var(--warm)}

/* questions */
.q{margin:0 0 30px}
.q:last-child{margin-bottom:6px}
.q-no{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em}
.q-text{font-size:16.5px;font-weight:700;line-height:1.7;margin:2px 0 6px}
.q-hint{font-size:13.5px;color:var(--muted);line-height:1.75;margin:0 0 10px;white-space:pre-line}
textarea,input[type=text]{
  width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;resize:vertical;
}
textarea:focus,input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.sub{display:grid;gap:8px}
.sub label{display:grid;grid-template-columns:7.5em 1fr;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
@media(max-width:460px){.sub label{grid-template-columns:1fr;gap:3px}}
.count{font-size:12px;color:var(--muted);text-align:right;margin-top:4px;font-variant-numeric:tabular-nums}
.count.warn{color:var(--warm);font-weight:700}

/* scale */
.scale{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 6px}
.scale button{
  flex:1 1 auto;min-width:40px;font:inherit;font-size:15px;font-weight:700;
  padding:11px 0;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  border-radius:9px;cursor:pointer;transition:.15s
}
.scale button:hover{border-color:var(--accent);color:var(--accent)}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:10px}

/* nav */
.nav{display:flex;gap:10px;margin:22px 0 0;align-items:center}
button.btn{
  font:inherit;font-weight:700;font-size:15.5px;padding:13px 22px;border-radius:11px;
  border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s
}
button.btn:hover{filter:brightness(1.08)}
button.btn.ghost{background:transparent;color:var(--accent)}
button.btn.sm{font-size:13.5px;padding:9px 15px}
.nav .spacer{flex:1}
.save-note{font-size:12px;color:var(--muted);text-align:center;margin:16px 0 0}

/* result */
.action{display:flex;gap:11px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.action:last-child{border-bottom:none}
.action input{margin:5px 0 0;width:19px;height:19px;flex:none;accent-color:var(--accent)}
.action .body{flex:1;min-width:0}
.action .t{font-weight:700;font-size:15.5px;line-height:1.65}
.action .w{font-size:13.5px;color:var(--muted);line-height:1.7;margin-top:3px}
.action.done .t,.action.done .w{opacity:.45;text-decoration:line-through}
.who{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:1px}
.who.me{background:var(--accent-soft);color:var(--accent)}
.who.sk{background:var(--warm-soft);color:var(--warm)}
.echo{background:var(--accent-soft);border-radius:10px;padding:14px 16px;margin:0 0 14px;font-size:14.5px;line-height:1.8}
.echo b{display:block;font-size:12px;letter-spacing:.05em;color:var(--accent);margin-bottom:4px}
pre.out{
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.75;
  white-space:pre-wrap;word-break:break-word;max-height:380px;overflow:auto;margin:0 0 12px
}
.row{display:flex;gap:9px;flex-wrap:wrap}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--fg);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:14px;font-weight:700;
  transition:.25s;z-index:50
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.theme{background:none;border:none;color:var(--muted);cursor:pointer;font-size:17px;padding:4px;line-height:1}
ul.plain{margin:0;padding-left:1.2em}
ul.plain li{margin-bottom:7px}
hr{border:none;border-top:1px solid var(--line);margin:26px 0}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="top-row">
      <span class="brand">一人暮らし ヒアリングシート</span>
      <span style="display:flex;align-items:center;gap:10px">
        <span class="step-label" id="stepLabel"></span>
        <button class="theme" id="themeBtn" title="表示を切り替える" aria-label="表示を切り替える">◐</button>
      </span>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </div>
</header>

<div class="wrap">
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>
<style>
.res{background:var(--warm-soft);border:1px solid color-mix(in srgb, var(--warm) 25%, transparent);
  border-radius:10px;padding:13px 15px;margin:10px 0 0;font-size:13.5px;line-height:1.8}
.res .rh{font-weight:700;color:var(--warm);font-size:12px;letter-spacing:.06em;margin-bottom:6px}
.res dl{margin:0;display:grid;grid-template-columns:5.5em 1fr;gap:3px 10px}
@media(max-width:460px){.res dl{grid-template-columns:1fr;gap:0 0}
  .res dt{margin-top:7px}}
.res dt{font-weight:700;color:var(--muted);font-size:12.5px}
.res dd{margin:0}
.res a{color:var(--warm);word-break:break-all}
.res .trap{margin-top:8px;padding-top:8px;border-top:1px dashed color-mix(in srgb, var(--warm) 30%, transparent)}
.res .trap b{color:var(--warm)}
.srcline{display:grid;grid-template-columns:1fr 8.5em;gap:8px;margin-top:8px}
@media(max-width:460px){.srcline{grid-template-columns:1fr}}
.srcline input{font-size:14px;padding:8px 10px}
.money{display:grid;grid-template-columns:1fr 6em;gap:8px;align-items:center}
.money .unit{font-size:14px;color:var(--muted)}
input[type=number]{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-align:right;font-variant-numeric:tabular-nums}
input[type=number]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
table.calc{width:100%;border-collapse:collapse;font-size:14.5px;margin:0 0 14px}
table.calc th,table.calc td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
table.calc td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.calc tr.total td{font-weight:800;border-top:2px solid var(--fg);border-bottom:none;font-size:16px}
table.calc tr.sub td{color:var(--muted)}
.flag{border-left:3px solid var(--warm);background:var(--warm-soft);padding:11px 14px;border-radius:0 9px 9px 0;margin:0 0 11px;font-size:14px;line-height:1.75}
.flag.ok{border-color:var(--ok);background:var(--ok-soft)}
.flag b{display:block;margin-bottom:2px}
.prio{font-size:11px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:5px;margin-right:7px;vertical-align:1px}
.prio.now{background:#c0392b;color:#fff}
.prio.wk{background:var(--warm-soft);color:var(--warm)}
.prio.lt{background:var(--accent-soft);color:var(--accent)}
details.more{margin:14px 0 0;font-size:14px}
details.more summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:14px}
details.more > div{padding:10px 0 0;line-height:1.8}
</style>

<script>
"use strict";
const KEY = "hitorigurashi-hearing-v1";
const FEE_URL = "https://admission.ritsumei.ac.jp/about/fee/";
const CHECKED_ON = "2026年10月27日";

/* 2027年度入学者の確定額（立命館大学 学費・奨学金ページで確認・2026-10-27）
   他学部は数字を断定せず、必ず公式ページで確認させる */
const TUITION = {
  "経営学部 経営学科":      { enroll:200000, year:1147200 },
  "経営学部 国際経営学科":  { enroll:200000, year:1286600 }
};

const yen = n => (n==null||isNaN(n)) ? "—" : Math.round(n).toLocaleString("ja-JP") + "円";
const man = n => (n==null||isNaN(n)) ? "—" : (Math.round(n/1000)/10).toLocaleString("ja-JP") + "万円";

/* ---------------- 設問 ---------------- */
const SECTIONS = [
{
  id:"a", title:"想いのたしかめ", field:"シラバスの 概要・目的・到達目標 の土台",
  lead:"ここが一番大事です。費用や計画は調べれば出てきますが、ここだけは本人にしか書けません。ここが薄いと、どれだけ数字をそろえても『借りてきた計画』に見えて、親には伝わりません。きれいな言葉より、本音を。",
  qs:[
    { id:"a1", type:"scale", q:"今、一人暮らしをしたい気持ちは10点満点で何点ですか？",
      hint:"正直に。10にしなくていいです。" },
    { id:"a1b", type:"long", rows:3, deep:40,
      q:"なぜその点数ですか？ そして、なぜ「それより1点低く」ないのですか？",
      hint:"低い方の理由ではなく、その点数を支えている理由を書きます。ここに出てくる言葉が、シラバスの「概要」で一番効きます。",
      ph:"例：8点。9じゃないのは少し不安もあるから。でも7じゃないのは、…" },
    { id:"a2", type:"long", rows:5, deep:80,
      q:"一人暮らしを始めて1か月たった、ふつうの平日。朝起きてから夜寝るまで、どんな1日を過ごしていますか？",
      hint:"頭の中の映像をそのまま書いてください。何時に起きて、どこで何をして、誰と会って、夜は何をしているか。\nここが具体的に書ける人は、本当にやりたい人です。ふわっとしか書けないなら、そこが弱点です。",
      ph:"例：7時に起きて、自分で作った朝ごはんを食べて、歩いて大学に行く。1限のあとは…" },
    { id:"a3", type:"long", rows:4, deep:50,
      q:"「一人暮らししたい」と最初に思ったのは、いつ、何があったときですか？",
      hint:"きっかけになった出来事を1つ。人から聞いた話でも、自分が経験したことでもいいです。親に話すとき、理屈より効くのはこれです。",
      ph:"例：去年の文化祭の準備で遅くなったとき、…" },
    { id:"a4", type:"long", rows:4, deep:50,
      q:"実家から通う4年間を想像してみてください。一番もったいない、嫌だと思うのはどんなことですか？",
      hint:"「通学がしんどい」の一段下まで。その時間で何ができなくなるのかを書きます。シラバスの「目的」になります。",
      ph:"例：夜のイベントに出られないこと。…" },
    { id:"a5", type:"long", rows:4,
      q:"逆に、「一人暮らしはやめておいた方がいい理由」を自分で挙げるとしたら？",
      hint:"自分で反論を書けるかどうかが、本気度の証明になります。ここを親より先に言えると、話の主導権がこちらに来ます。空欄なら面談で一緒に考えます。",
      ph:"例：お金がかかる。生活が乱れるかもしれない。…" },
    { id:"a6", type:"long", rows:4, deep:40,
      q:"4年後、親に何と言われたら「やってよかった」と思えますか？",
      hint:"そのセリフを、できればカギカッコで書いてください。シラバスの「到達目標」は、この言葉から逆算して作ります。",
      ph:"例：「行かせてよかった」…" }
  ]
},
{
  id:"b", title:"通学のこと", field:"シラバスの 目的",
  lead:"「実家から通えるでしょ」への答えを、数字で作ります。感覚ではなく、調べた数字で。",
  qs:[
    { id:"b1", type:"group", q:"実家の最寄り駅から、大阪いばらきキャンパス（OIC）まで",
      fields:[
        {k:"eki", label:"最寄り駅", ph:"例：〇〇駅"},
        {k:"min", label:"片道（分）", ph:"例：75", num:true},
        {k:"nori", label:"乗り換え", ph:"例：2回"},
        {k:"teiki", label:"定期代（月）", ph:"例：12000", num:true}
      ],
      src:true,
      research:{
        what:"ドア・トゥ・ドアの片道時間（分）と、6か月定期の月あたり金額",
        where:[{t:"Googleマップで「自宅最寄り駅 → 南茨木駅」を平日8時着で検索", u:"https://www.google.com/maps/dir/"},
               {t:"ジョルダン／Yahoo!乗換案内で定期代（6か月）を出す", u:"https://transit.yahoo.co.jp/"}],
        check:"OICの最寄りは阪急「南茨木」またはJR「茨木」。駅から大学まで徒歩5〜10分かかるので、それも足す",
        trap:"電車に乗っている時間だけを書かないこと。家から駅までと、駅から教室までを入れると、たいてい15〜25分増える。親は実感で知っているので、短く見積もると一発で信用を失う"
      } },
    { id:"b2", type:"long", rows:4, deep:40,
      q:"実家から通うと、具体的に何ができなくなりますか？",
      hint:"1限、サークル、バイト、夜の活動、課題の時間。a4で書いたことと重なってOKです。ここは時間の話に寄せます。" }
  ]
},
{
  id:"c", title:"大学で学ぶこと", field:"シラバスの 到達目標",
  lead:"ここが埋まっていないと、一人暮らしは「遊びたいだけ」に見えます。学部の中身は公式サイトで必ず裏を取ります。",
  qs:[
    { id:"c1", type:"short", q:"進学する学部・学科は？",
      hint:"次の費用計算で使うので、学科まで書いてください。例：経営学部 経営学科",
      ph:"例：経営学部 経営学科" },
    { id:"c2", type:"long", rows:4, deep:40,
      q:"なぜその学部ですか？",
      hint:"「なんとなく」でも、その「なんとなく」の中身を書き出します。" },
    { id:"c3", type:"long", rows:4,
      q:"気になっている授業・ゼミ・プログラムの名前を、3つ書いてください。",
      hint:"固有名詞で。ここが書けると、親の見る目が変わります。調べ方は下にあります。",
      ph:"例：〇〇ゼミ、△△プログラム、…",
      research:{
        what:"実在する授業名・ゼミ名・留学/インターンのプログラム名を3つ",
        where:[{t:"立命館大学 経営学部の公式サイト（カリキュラム・ゼミ紹介）", u:"https://www.ritsumei.ac.jp/ba/"},
               {t:"立命館大学 シラバス検索（実際の授業の内容が読める）", u:"https://www.ritsumei.ac.jp/pathways-future/curriculum/"}],
        check:"3つのうち1つは「1回生で取れるもの」にする。4年後の話だけだと、来年から何をするのかが見えない",
        trap:"パンフレットの見出しをそのまま写さない。授業名だけでなく「何をする授業か」を一言添えられる状態にしておく。親に聞かれて答えられないと逆効果"
      } },
    { id:"c4", type:"long", rows:4, deep:50,
      q:"卒業するとき、どうなっていたいですか？",
      hint:"a6で書いた「言われたい言葉」と、つながっていますか。仕事、身につけたい力、どんな人になっているか。" }
  ]
},
{
  id:"d", title:"4年間の計画", field:"シラバスの 授業計画",
  lead:"1回生は具体的に、2回生以降は方向性だけ。4年分を細かく書くと、かえって嘘っぽくなります。",
  qs:[
    { id:"d1", type:"long", rows:5, deep:60,
      q:"1回生の1年間でやることを、できるだけ具体的に。",
      hint:"サークル名、資格名、バイトの種類、留学の準備など。固有名詞と時期を入れます。前期と後期に分けて書けるとなおよいです。" },
    { id:"d2", type:"long", rows:4,
      q:"2回生以降にやってみたいことは？（方向性だけでOK）",
      hint:"長く書きすぎないこと。ここは短い方が信用されます。" }
  ]
},
{
  id:"e", title:"お金のこと", field:"シラバスの 費用",
  lead:"親が実際に判断するのは「一人暮らしで増える分（差額）」だけです。学費は実家から通ってもかかるので、判断材料ではありません。ここは全部、出典のある数字で埋めます。推測で書いた数字は、親に1回崩されたらそのあとが全部疑われます。",
  qs:[
    { id:"e1", type:"money", q:"学費（授業料）は年いくらですか？", unit:"円 / 年", src:true,
      hint:"入学金は含めず、授業料の年額です。上で書いた学科を選べば、下に確認済みの数字が出ます。",
      research:{
        what:"2027年度入学者の、学科別の授業料（年額）と入学金",

const toast = m => { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 1900); };

/* ---------------- 計算 ---------------- */
function calc(){
  const teiki = gn("b1.teiki");
  const addMonthly = gn("e3") + gn("e5") + gn("e6") + gn("e7") - gn("e8") - teiki;
  const init = gn("e4");
  const total4 = addMonthly * 48 + init;
  const baito = gn("e9") * 46;              // 4年48か月のうち46か月稼働で見積もる
  const scholar = gn("e10") * 48;
  const chokin = gn("e11");
  const oya = gn("e12") * 48;
  const mine = baito + scholar + chokin;
  const gap = total4 - mine - oya;
  const tuition = gn("e1") * 4 + 200000 + gn("e2");   // 授業料×4＋入学金＋諸会費
  return { teiki, addMonthly, init, total4, baito, scholar, chokin, oya, mine, gap, tuition };
}

/* ---------------- アクション導出 ---------------- */

function qHTML(q){
  const o = [];

    o.push('<div class="scale" data-scale="'+q.id+'">');

    o.push('</div><div class="scale-ends"><span>1　まあ住めたらいいな</span><span>10　絶対にやりたい</span></div>');
  } else if (q.type === "group"){
    o.push('<div class="sub">');
    q.fields.forEach(f => { const k = q.id+"."+f.k;
      o.push('<label><span>'+esc(f.label)+'</span><input type="'+(f.num?"number":"text")+'" data-k="'+k+'" value="'+esc(g(k))+'" placeholder="'+esc(f.ph||"")+'"></label>'); });
    o.push('</div>');
  } else if (q.type === "money"){
    o.push('<div class="money"><input type="number" inputmode="numeric" data-k="'+q.id+'" value="'+esc(g(q.id))+'" placeholder="0"><span class="unit">'+esc(q.unit||"円")+'</span></div>');

      const t = TUITION[String(g("c1")).trim()];
      if (t) o.push('<div style="margin-top:8px"><button type="button" class="btn sm ghost" data-fill="'+t.year+'">確認済みの額（'+yen(t.year)+'）を入れる</button></div>');
    }
  } else if (q.type === "short"){
    o.push('<input type="text" data-k="'+q.id+'" value="'+esc(g(q.id))+'" placeholder="'+esc(q.ph||"")+'">');
  } else {
    o.push('<textarea data-k="'+q.id+'" rows="'+(q.rows||4)+'" placeholder="'+esc(q.ph||"")+'">'+esc(g(q.id))+'</textarea>');
    if (q.deep) o.push('<div class="count" data-count="'+q.id+'"></div>');
  }

  if (q.src){
    o.push('<div class="srcline">'
      +'<input type="text" data-k="'+q.id+'.src" value="'+esc(g(q.id+".src"))+'" placeholder="出典（URL・サイト名・誰に聞いたか）">'
      +'<input type="text" data-k="'+q.id+'.date" value="'+esc(g(q.id+".date"))+'" placeholder="確認した日">'
      +'</div>');
  }
  if (q.research){
    const r = q.research;
    o.push('<div class="res"><div class="rh">調べ方</div><dl>');
    o.push('<dt>取る数字</dt><dd>'+esc(r.what)+'</dd>');
    o.push('<dt>どこで</dt><dd>'+r.where.map(w => w.u
      ? '<a href="'+w.u+'" target="_blank" rel="noopener">'+esc(w.t)+'</a>' : esc(w.t)).join('<br>')+'</dd>');

    o.push('</div>');
  }
  o.push('</div>');
  return o.join("");

    o.push('</tbody></table>');
    o.push('<table class="calc"><tbody>');
    o.push('<tr><td>バイト（月'+yen(gn("e9"))+' × 46か月）</td><td class="n">'+yen(c.baito)+'</td></tr>');
    o.push('<tr><td>奨学金（月'+yen(gn("e10"))+' × 48か月）</td><td class="n">'+yen(c.scholar)+'</td></tr>');
    o.push('<tr><td>貯金・入学祝い</td><td class="n">'+yen(c.chokin)+'</td></tr>');
    o.push('<tr class="total"><td>自分で出せる額</td><td class="n">'+yen(c.mine)+'</td></tr>');
    o.push('</tbody></table>');
    if (c.gap > 0) o.push('<div class="flag"><b>4年間で '+man(c.gap)+' 足りません</b>'
      + 'これを親にお願いする額として書くか、バイト・奨学金・家賃のどれかを見直します。'
      + '月あたりにすると約'+yen(c.gap/48)+'です。この数字を自分の口で説明できるようにしてください。</div>');
    else o.push('<div class="flag ok"><b>自分の負担でまかなえる計算になっています</b>'
      + 'ただし、計算どおりに進む前提です。バイトが減ったときどうするかまで言えると、さらに強くなります。</div>');
    if (c.tuition > 0) o.push('<p class="lead">参考：4年間の学費は '+yen(c.tuition)
      +'（授業料'+yen(gn("e1"))+'×4＋入学金200,000円'+(gn("e2")>0?'＋諸会費'+yen(gn("e2")):'')
      +'）。これは実家から通っても同じなので、判断材料には入れません。</p>');
  }
  /* 精度チェック */
  const srcs = [["e1","学費"],["e3","家賃"],["e4","初期費用"],["b1","定期代・通学時間"]];
  const miss = srcs.filter(([k])=>!has(k+".src"));
  o.push('<h3>出典がついているか</h3>');
  o.push('<p class="lead">親に「それどこの数字？」と聞かれて答えられない数字が1つでもあると、資料全体が疑われます。</p>');
  o.push('<table class="calc"><tbody>'+srcs.map(([k,t])=>'<tr><td>'+esc(t)+'</td><td class="n">'
    +(has(k+".src") ? '<span style="color:var(--ok)">記録あり</span>' : '<span style="color:var(--warm)">未記入</span>')+'</td></tr>').join("")+'</tbody></table>');
  o.push('</section>');

  /* アクション */
  o.push('<section class="card"><span class="tag warm">ここからやること</span><h2>次にやること（'+A.length+'件）</h2>');
  o.push('<p class="lead">上から順に。締切があるものを先に置いています。チェックは保存されます。</p>');
  ["now","wk","lt"].forEach(p => { const list = grp(p); if(!list.length) return;
    o.push('<h3><span class="prio '+p+'">'+label[p]+'</span></h3>');
    list.forEach((a,i)=>{ const key = "__act."+p+"."+i;
      o.push('<div class="action'+(g(key)?' done':'')+'">'
        +'<input type="checkbox" data-k="'+key+'"'+(g(key)?' checked':'')+'>'
        +'<div class="body"><div class="t">'+esc(a.t)+'<span class="who '+(a.who==="本人"?"me":"sk")+'">'+esc(a.who)+'</span></div>'
        +'<div class="w">'+esc(a.w)+'</div></div></div>'); });
  });
  o.push('</section>');

  /* 出力 */
  o.push('<section class="card"><span class="tag">書き出す</span><h2>シラバスの下書き</h2>');
  o.push('<p class="lead">いまの答えから作った下書きです。〔未記入〕が残っているところが、まだ埋まっていない欄です。</p>');
  o.push('<pre class="out" id="syl">'+esc(syllabus())+'</pre>');
  o.push('<div class="row"><button class="btn sm" data-copy="syl">下書きをコピー</button>'
    +'<button class="btn sm ghost" data-dl="syllabus">ファイルで保存</button></div>');
  o.push('<h3>答えぜんぶ（SKに送る用）</h3>');
  o.push('<pre class="out" id="raw">'+esc(dump())+'</pre>');
  o.push('<div class="row"><button class="btn sm" data-copy="raw">答えをコピー</button>'
    +'<button class="btn sm ghost" data-dl="answers">ファイルで保存</button>'
    +'<button class="btn sm ghost" data-reset="1">ぜんぶ消す</button></div>');
  o.push('</section>');
  o.push('<div class="nav"><button class="btn ghost" data-go="'+(TOTAL-2)+'">もどる</button>'
    +'<span class="spacer"></span><button class="btn ghost sm" data-go="1">最初から見直す</button></div>');
  return o.join("");
}

function dump(){
  const L = ["# ヒアリングの答え", ""];
  SECTIONS.forEach(s => { L.push("## " + s.title); L.push("");
    s.qs.forEach(q => {
      let val;
      if (q.type === "group") val = q.fields.map(f => f.label + "：" + (g(q.id+"."+f.k) || "—")).join(" / ");
      else if (q.type === "money") val = has(q.id) ? yen(gn(q.id)) + " " + (q.unit||"") : "—";
      else val = has(q.id) ? g(q.id) : "—";
      L.push("**" + q.q + "**"); L.push(String(val)); 
      if (q.src && (has(q.id+".src")||has(q.id+".date"))) L.push("出典：" + g(q.id+".src") + "（" + (g(q.id+".date")||"日付未記入") + "）");
      L.push("");
    });
  });
  const c = calc();
  L.push("## 計算"); L.push("");
  L.push("- 月に増える額：" + yen(c.addMonthly));
  L.push("- 4年間で増える額：" + yen(c.total4));
  L.push("- 自分で出せる額：" + yen(c.mine));
  L.push("- 足りない額：" + yen(c.gap));
  L.push("");
  L.push("## 次にやること"); L.push("");
  actions().forEach(a => L.push("- [" + ({now:"今週中",wk:"面談まで",lt:"そのあと"})[a.prio] + "/" + a.who + "] " + a.t));
  return L.join("\n");
}

/* ---------------- 入力の配線 ---------------- */
function wire(){
  app.querySelectorAll("[data-k]").forEach(el => {
    const k = el.dataset.k;
    const h = () => { S[k] = (el.type === "checkbox") ? (el.checked ? 1 : "") : el.value; save();
      if (el.type === "checkbox") el.closest(".action").classList.toggle("done", el.checked);
      const cEl = app.querySelector('[data-count="'+k+'"]'); if (cEl) updCount(cEl, k);
    };
    el.addEventListener("input", h); el.addEventListener("change", h);
  });
  app.querySelectorAll("[data-count]").forEach(el => updCount(el, el.dataset.count));
  app.querySelectorAll("[data-scale]").forEach(box => box.addEventListener("click", e => {
    const b = e.target.closest("button[data-v]"); if (!b) return;
    S[box.dataset.scale] = b.dataset.v; save();
    box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  }));
  app.querySelectorAll("[data-fill]").forEach(b => b.addEventListener("click", () => {
    const inp = app.querySelector('[data-k="e1"]'); inp.value = b.dataset.fill; S.e1 = b.dataset.fill;
    const src = app.querySelector('[data-k="e1.src"]');
    if (src && !src.value){ src.value = "立命館大学 学費・奨学金 " + FEE_URL; S["e1.src"] = src.value; }
    const dt = app.querySelector('[data-k="e1.date"]');
    if (dt && !dt.value){ dt.value = CHECKED_ON; S["e1.date"] = dt.value; }
    save(); toast("入れました");
  }));
  app.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
    step = Math.max(0, Math.min(TOTAL-1, Number(b.dataset.go))); save(); render(); }));
  app.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
    const t = document.getElementById(b.dataset.copy).textContent;
    try { await navigator.clipboard.writeText(t); toast("コピーしました"); }
    catch(e){ const r = document.createRange(); r.selectNodeContents(document.getElementById(b.dataset.copy));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("選択しました。長押しでコピー"); }
  }));
  app.querySelectorAll("[data-dl]").forEach(b => b.addEventListener("click", () => {
    const name = b.dataset.dl;
    const text = name === "syllabus" ? syllabus() : dump();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], {type:"text/markdown;charset=utf-8"}));
    a.download = name + ".md"; a.click(); URL.revokeObjectURL(a.href); toast("保存しました");
  }));
  app.querySelectorAll("[data-reset]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.armed){ localStorage.removeItem(KEY); S = {}; step = 0; render(); return; }
    b.dataset.armed = "1"; b.textContent = "本当に消す？もう一度押す";
  }));
}
function updCount(el, k){
  const q = findQ(k), n = String(g(k)).trim().length, need = (q && q.deep) || 40;
  if (n === 0){ el.textContent = ""; return; }
  el.textContent = n + "文字";
  el.classList.toggle("warn", n < need);
  if (n < need) el.textContent = n + "文字 — もう少しくわしく（目安" + need + "文字）";
}

/* ---------------- テーマ ---------------- */
const tBtn = document.getElementById("themeBtn");
if (localStorage.getItem("theme")) document.documentElement.dataset.theme = localStorage.getItem("theme");
tBtn.addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next; localStorage.setItem("theme", next);
});

render();
</script>
